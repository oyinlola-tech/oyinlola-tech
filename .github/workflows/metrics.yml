name: GitHub metrics

# Renders the activity, repository, language and calendar card that README.md
# embeds, and commits it to the `metrics` branch so main stays clean.
#
# Uses the METRICS_TOKEN repository secret when it exists and falls back to
# the workflow token otherwise. A personal access token with public read
# access sees strictly more (commit counts, activity across all repositories):
#
#   https://github.com/settings/personal-access-tokens/new  ->  Public repositories (read-only)
#   Repository settings -> Secrets and variables -> Actions -> METRICS_TOKEN

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The metrics action commits through the API and fails with 404 when the
      # target branch does not exist yet, so create it once as an empty orphan.
      - name: Ensure the metrics branch exists
        run: |
          if git ls-remote --exit-code --heads origin metrics >/dev/null 2>&1; then
            echo "metrics branch already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan metrics
          git rm -rf --quiet .
          git commit --allow-empty -m "chore: create metrics branch"
          git push origin metrics

      - name: Render github-metrics.svg
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          committer_branch: metrics
          committer_message: "chore: refresh GitHub metrics"
          template: classic
          config_timezone: Africa/Lagos
          config_display: large
          config_twemoji: yes
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
          plugin_languages_indepth: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
