name: README artwork

# assets/*.svg are generated by scripts/build_assets.py. This proves the
# generator still runs from a clean machine and that every file it writes is
# well-formed XML, so a broken edit to the script is caught before the README
# shows a broken image.

on:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/**", ".github/workflows/assets.yml"]
  pull_request:
    paths: ["scripts/**", "assets/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the generator's dependencies
        run: pip install fonttools brotli uharfbuzz

      - name: Build every SVG
        run: python scripts/build_assets.py

      - name: Check each SVG is well-formed and README references exist
        run: |
          python - <<'PY'
          import re, sys, xml.dom.minidom
          from pathlib import Path
          bad = []
          for f in sorted(Path("assets").glob("*.svg")):
              try:
                  xml.dom.minidom.parse(str(f))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          for ref in re.findall(r'src="(assets/[^"]+)"', Path("README.md").read_text()):
              if not Path(ref).exists():
                  bad.append(f"README.md references a missing file: {ref}")
          print("\n".join(bad) or "all assets are well-formed and present")
          sys.exit(1 if bad else 0)
          PY
